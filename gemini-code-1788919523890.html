<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get Involved | Kochi Local</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col">

  <!-- Header -->
  <nav class="sticky top-0 z-50 backdrop-blur-md bg-slate-950/80 border-b border-slate-800">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <a href="/" class="text-xl font-bold tracking-wider text-white">KOCHI LOCAL</a>
        <a href="/" class="text-xs text-slate-400 hover:text-white transition-colors">← Back to Home</a>
      </div>
    </div>
  </nav>

  <!-- Form Wrapper -->
  <main class="flex-grow max-w-4xl mx-auto px-4 py-12 w-full text-center">
    <h1 class="text-3xl font-bold text-white mb-2">Get Involved & Contact Us</h1>
    <p class="text-slate-400 text-sm mb-8">Fill out the Google Form below for general inquiries, volunteer sign-ups, or CSR partnership proposals.</p>

    <div class="w-full bg-slate-900/60 rounded-2xl border border-slate-800 overflow-hidden shadow-xl p-2 sm:p-4">
      <!-- Embed Code -->
      <iframe 
        src="YOUR_GOOGLE_FORM_EMBED_URL_HERE" 
        width="100%" 
        height="800" 
        frameborder="0" 
        marginheight="0" 
        marginwidth="0" 
        class="w-full rounded-xl">
        Loading form...
      </iframe>
    </div>
  </main>

  <footer class="py-6 bg-slate-950 text-slate-500 text-xs text-center border-t border-slate-900">
    <p>© Kochi Local • <a href="https://kochilocal.in" class="hover:text-white">kochilocal.in</a></p>
  </footer>

</body>
</html>
